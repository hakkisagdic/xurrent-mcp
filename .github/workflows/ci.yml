# CI — üç dilin doğrulama katmanlarının HEPSİ, iki hızda.
#
# Neden matrix YOK: bu repoda "üç dil" bir matris ekseni değil, TEK bir
# sözleşmenin üç implementasyonudur. Sözleşme doğrulaması (verify-contract) ve
# uyum denetleyicisi (mcp-uyum) üç sunucuyu AYNI ANDA ayağa kaldırıp
# KARŞILAŞTIRIR — üçünü ayrı job'lara bölmek bu karşılaştırmayı imkânsız kılar.
# Yani matrix burada paralellik değil, KÖRLÜK üretirdi.
#
# ★ BÖLÜNME EKSENİ DİL DEĞİL, HIZDIR.
#   hızlı  → derleme + birim + şema   (~3-4 dk)  ilk geri bildirim
#   yavaş  → sözleşme + protokol uyumu + uçtan uca + wire  (~10-20 dk)
#   özet   → iki raporu tek tabloda birleştirir, TEK zorunlu kontrol olur
#
#   Bir tsc hatası için 20 dakika beklemek, o hatayı gören insanın dikkatini
#   çoktan başka yere kaydırmış olur. Derleme kırıldığında yavaş katmanı hiç
#   koşturmuyoruz — kırık derlemeden çıkan uçtan uca hatası zaten türev bir
#   gürültüdür, yeni bilgi taşımaz.
#
#   Bedeli açıkça yazılmalı: yavaş iş `derleme` grubunu TEKRAR koşar (~1-2 dk).
#   Alternatifi dist/ + bin/ + .venv'i işler arasında artifact ile taşımaktı;
#   .venv taşınabilir DEĞİLDİR (mutlak yollar gömülüdür) ve bayat bir derleme
#   çıktısını ölçme riski, yeniden derlemenin bedelinden pahalıdır.
#
# Ağ: kurulum adımları (npm ci / uv sync / dotnet restore) ağ ister. Testlerin
# KENDİSİ istemez — varsayılan XURRENT_MODE=mock, CALENDAR_PROVIDER=mock ve LLM
# çağrısı yapan tek adım (wire-denetimi) yerel sahte Gemini'ye konuşur.
#
# Eylem sürümleri SHA ile SABİTLENMİŞTİR (tedarik zinciri). Yanındaki yorum
# insan-okunur sürümdür; dependabot ikisini birlikte günceller.
name: ci

on:
  # branches filtresi verildiği için ETİKET push'ları buraya DÜŞMEZ — v* etiketi
  # release.yml'i tetikler ve o zaten test-all'ı baştan koşar.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      bilinen_ihlaller:
        description: "Bilinen MUST ihlallerini (scripts/bilinen-ihlaller.json) KALDI yerine ATLANDI say"
        type: boolean
        default: false

# Aynı dal için üst üste gelen koşuları iptal et; CI kuyruğu ders günü tıkanmasın.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# En dar varsayılan. Hiçbir iş bunu yükseltmiyor: CI yalnızca OKUR.
# (PR'ye bot yorumu yazmak isteyen bir iş `pull-requests: write` isterdi —
#  bilinçli olarak eklenmedi, bkz. KARARLAR-CICD.md § K-4)
permissions:
  contents: read

env:
  # Testler ağ ya da hesap İSTEMEZ. Bu üçü .env.example varsayılanlarıyla
  # aynıdır; burada AÇIKÇA yazılmalarının sebebi, bir gün varsayılan
  # değişirse CI'nın sessizce canlı sisteme bağlanmaması.
  XURRENT_MODE: mock
  XURRENT_DRY_RUN: "1"
  CALENDAR_PROVIDER: mock
  # Ders çıktıları saat dilimine duyarlıdır (bkz. docs/14 § kırılgan test).
  # CI'yı UTC'de değil, dersin anlatıldığı dilimde koşturuyoruz ki
  # "yerelde geçiyor, CI'da kalıyor" sınıfı bir fark ortaya çıkmasın.
  TZ: Europe/Istanbul
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # ── 1) HIZLI: derleme + birim + şema ────────────────────────────────────
  hizli:
    name: hızlı (derleme · birim · şema)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ortam kur
        uses: ./.github/actions/ortam-kur

      # --json: makine-okunur rapor stdout'a (artifact), anlatım stderr'e (log).
      # Böylece iş akışı logunda İNSAN OKUNAKLI tablo görünür, artifact'ta ise
      # adım adım süre/kanıt kalır.
      - name: Derleme · birim · şema
        run: |
          node scripts/test-all.mjs --json --no-color \
            --sadece derleme,birim,sema \
            > test-all-hizli.json

      - name: Raporu yükle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-all-raporu-hizli
          path: test-all-hizli.json
          if-no-files-found: warn
          retention-days: 14

  # ── 2) YAVAŞ: sözleşme + protokol + uçtan uca + wire ────────────────────
  yavas:
    name: yavaş (sözleşme · uyum · uçtan uca · wire)
    needs: hizli
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ortam kur
        uses: ./.github/actions/ortam-kur

      # `derleme` grubu BİLEREK tekrar koşuluyor: bu işteki adımların ön koşulu
      # dist/ · bin/ · .venv'dir ve bunlar işler arasında taşınmıyor (başlıktaki
      # gerekçe). test-all'ın bağımlılık modeli de böylece doğru çalışır —
      # `gerektirir` bağı bu koşuda GERÇEKTEN ölçülmüş bir derlemeye dayanır.
      #
      # --bilinen-ihlaller BİLİNÇLİ OLARAK varsayılan DEĞİLDİR. Bilinen bir MUST
      # ihlalini sessizleştirmek bir KARAR olmalıdır, bir alışkanlık değil.
      # Elle koşuda (workflow_dispatch) açılabilir. Bayrak yalnızca mcp-uyum
      # adımını etkiler, o da bu işte koşar.
      - name: Sözleşme · uyum · uçtan uca · wire
        run: |
          node scripts/test-all.mjs --json --no-color \
            --sadece derleme,sozlesme,protokol,uctan-uca,wire \
            ${{ inputs.bilinen_ihlaller && '--bilinen-ihlaller' || '' }} \
            > test-all-yavas.json

      - name: Raporu yükle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-all-raporu-yavas
          path: test-all-yavas.json
          if-no-files-found: warn
          retention-days: 14

  # ── 3) ÖZET: iki raporu tek tabloda birleştir ───────────────────────────
  # Bu iş, dal koruma kuralında ZORUNLU KONTROL olarak seçilecek tektir:
  # hızlı ya da yavaş iş kırıldığında burası da kırılır, ama okuyan insan
  # önce TEK bir tablo görür — hangi işin hangi adımı kaldığını aramak zorunda
  # kalmaz.
  ozet:
    name: özet
    needs: [hizli, yavas]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bu iş yalnızca bir .mjs çalıştırır: Python/.NET gerekmez, bağımlılık
      # kurulmaz, npm önbelleği geri yüklenmez.
      - name: Ortam kur (yalnızca Node)
        uses: ./.github/actions/ortam-kur
        with:
          python: "false"
          dotnet: "false"
          bagimliliklar: "false"

      # pattern + merge-multiple: iki iş de kendi raporunu ayrı artifact olarak
      # yükledi. Yavaş iş hiç koşmadıysa (hızlı kırıldı) sadece biri iner —
      # bu bir hata değildir, özet o durumu da anlatır.
      - name: Raporları indir
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-all-raporu-*
          path: raporlar
          merge-multiple: true

      - name: Birleşik özeti yaz
        run: |
          shopt -s nullglob
          raporlar=(raporlar/*.json)
          if [ ${#raporlar[@]} -eq 0 ]; then
            {
              echo "## test-all"
              echo ""
              echo "Hiç rapor üretilmedi — koşu doğrulama başlamadan kırıldı."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # --eksik-onemsiz: eksik rapor bu adımı KIRMASIN. Asıl kırmızı,
            # aşağıdaki kapı adımından gelir; aynı olayı iki kez saymıyoruz.
            node .github/scripts/rapor-ozeti.mjs \
              --baslik "test-all — birleşik" --eksik-onemsiz \
              "${raporlar[@]}" >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # Birleşik raporlar tek artifact olarak da dursun: release.yml ve elle
      # inceleme aynı dosya kümesini bekler.
      - name: Birleşik raporu yükle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-all-raporu
          path: raporlar/
          if-no-files-found: warn
          retention-days: 14

      # ── Kapı ───────────────────────────────────────────────────────────
      # `needs.*.result` = success | failure | cancelled | skipped.
      # "skipped" burada başarı DEĞİLDİR: yavaş iş atlandıysa hızlı iş kırılmış
      # demektir ve o durumda da kırmızı yanmalıyız.
      - name: Sonuç kapısı
        run: |
          hizli='${{ needs.hizli.result }}'
          yavas='${{ needs.yavas.result }}'
          echo "hızlı=$hizli · yavaş=$yavas"
          if [ "$hizli" != "success" ] || [ "$yavas" != "success" ]; then
            echo "::error::doğrulama tamamlanmadı (hızlı=$hizli, yavaş=$yavas)"
            exit 1
          fi
