[project]
name = "xurrent-mcp"
version = "1.0.0"
description = "Xurrent (ITSM) MCP sunucusu — Python implementasyonu. contract/tools.json sözleşmesini birebir uygular."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "mcp==2.0.0",
    "anthropic==0.120.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
]

[project.scripts]
xurrent-mcp = "xurrent_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xurrent_mcp"]
