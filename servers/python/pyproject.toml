[project]
name = "xurrent-mcp"
version = "1.0.0"
description = "Xurrent (ITSM) MCP sunucusu — Python implementasyonu. contract/tools.json sözleşmesini birebir uygular."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "mcp==2.0.0",
    # LLM saglayicisi: Gemini. SDK EKLENMEZ — `generateContent` tek bir POST'tur
    # ve httpx zaten Xurrent GraphQL icin bagimlilik listesinde. Wire formatinin
    # gorunur kalmasi bu projede bilincli bir ders tercihidir.
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[project.scripts]
xurrent-mcp = "xurrent_mcp.__main__:main"

# Cekirdek is mantiginin birim testleri: uv run pytest -q
#
# Testler I/O YAPMAZ, ag KULLANMAZ ve GERCEK ZAMANA BAGLI DEGILDIR.
# "Bugun" tests/conftest.py'deki autouse fixture ile sabitlenir; sebebi bu
# repoda yasandi (bkz. commit "Fix timezone-dependent flake ...").
[tool.pytest.ini_options]
testpaths = ["tests"]
# -q BILEREK BURADA DEGIL: belgelenen komut `uv run pytest -q` ve addopts'a da
# koyulursa -qq olur; pytest o seviyede "N passed" ozet satirini HIC basmaz.
# Bir test kosucusunun kac testin gectigini gizlemesi kabul edilemez.
# --strict-markers: yanlis yazilmis bir @pytest.mark sessizce yok sayilmasin.
# -rxX: xfail/xpass olan her test ADIYLA ve GEREKCESIYLE ozete dusmelidir —
#       bilinen bir bulgunun ekranda gorunmemesi onu gizlemek olurdu.
addopts = "--strict-markers -rxX"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xurrent_mcp"]
